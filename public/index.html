<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>Miven · Lista de compras</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- App principal -->
    <div id="app" class="app">
      <header class="header">
        <div class="header-title">
          <span class="header-logo">🛒</span>
          <h1>Miven</h1>
        </div>
        <button id="name-btn" class="icon-btn" title="Cambiar tu nombre">👤 <span id="name-label">Tú</span></button>
      </header>

      <form id="add-form" class="add-form">
        <input
          id="item-input"
          type="text"
          placeholder="¿Qué necesitamos comprar?"
          autocomplete="off"
          required
        />
        <input id="qty-input" type="text" placeholder="Cant." class="qty" autocomplete="off" />
        <button type="submit" class="add-btn" aria-label="Agregar">＋</button>
      </form>

      <main class="list-wrap">
        <ul id="list" class="list"></ul>
        <p id="empty" class="empty hidden">Tu lista está vacía 🎉<br />Agrega lo primero arriba.</p>
      </main>

      <footer class="footer">
        <span id="counter" class="counter"></span>
        <button id="clear-btn" class="clear-btn hidden">Borrar comprados</button>
      </footer>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
