<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f766e" />
    <title>Miven · Lista de compras</title>

    <!-- Que se comporte como app instalada -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Miven" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- App principal -->
    <div id="app" class="app">
      <header class="header">
        <div class="header-title">
          <span class="header-logo">🛒</span>
          <h1>Miven</h1>
        </div>
        <button id="name-btn" class="icon-btn" title="Cambiar tu nombre">👤 <span id="name-label">Tú</span></button>
      </header>

      <form id="add-form" class="add-form">
        <input
          id="item-input"
          class="item-field"
          type="text"
          placeholder="¿Qué necesitamos comprar?"
          autocomplete="off"
          required
        />
        <input id="qty-input" type="text" placeholder="Cant." class="qty" autocomplete="off" />
        <button type="submit" class="add-btn" aria-label="Agregar">＋</button>
      </form>

      <main class="list-wrap">
        <ul id="list" class="list"></ul>
        <p id="empty" class="empty hidden">Tu lista está vacía 🎉<br />Agrega lo primero arriba.</p>
      </main>

      <footer class="footer">
        <span id="counter" class="counter"></span>
        <button id="clear-btn" class="clear-btn hidden">Borrar comprados</button>
      </footer>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
