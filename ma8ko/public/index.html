<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ma8ko</title>
    <meta name="theme-color" content="#6d5bd0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ma8ko" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Bienvenida: tu nombre (y el del bebé la primera vez) -->
    <section id="welcome" class="screen-center hidden">
      <form id="welcome-form" class="card narrow">
        <img class="welcome-logo" src="/icon.svg" alt="" />
        <h1>Welcome to Ma8ko!</h1>
        <label class="field">
          <span>What's your name?</span>
          <input id="welcome-me" maxlength="40" placeholder="e.g. Kevin or Micaela" required />
        </label>
        <div id="welcome-baby">
          <label class="field">
            <span>Baby's name</span>
            <input id="welcome-baby-name" maxlength="60" placeholder="e.g. Mateo" />
          </label>
          <label class="field">
            <span>Date of birth</span>
            <input id="welcome-baby-birth" type="date" />
          </label>
        </div>
        <button class="btn primary block" type="submit">Get started</button>
      </form>
    </section>

    <!-- App -->
    <div id="app" class="app hidden">
      <header class="topbar">
        <img class="topbar-logo" src="/icon.svg" alt="" />
        <div class="baby">
          <div class="baby-name" id="baby-name">Ma8ko</div>
          <div class="baby-age" id="baby-age"></div>
        </div>
        <button class="icon-btn" id="btn-settings" aria-label="Settings">⚙️</button>
      </header>

      <div id="timers" class="timers"></div>

      <main class="content" id="content">
        <section id="view-hoy" class="view"></section>
        <section id="view-historial" class="view hidden"></section>
        <section id="view-pediatra" class="view hidden"></section>
        <section id="view-gastos" class="view hidden"></section>
        <section id="view-reporte" class="view hidden"></section>
      </main>

      <nav class="tabbar">
        <button data-view="hoy" class="active"><span>🏠</span>Today</button>
        <button data-view="historial"><span>📅</span>History</button>
        <button data-view="pediatra"><span>🩺</span>Pediatrician</button>
        <button data-view="gastos"><span>💰</span>Expenses</button>
      </nav>
    </div>

    <!-- Hoja inferior genérica (formularios y detalles) -->
    <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
    <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div id="sheet-body"></div>
    </div>

    <!-- Visor de fotos a pantalla completa -->
    <div id="viewer" class="viewer hidden">
      <img id="viewer-img" alt="Photo" />
      <div class="viewer-bar">
        <button class="btn ghost light" id="viewer-prev">‹</button>
        <a class="btn ghost light" id="viewer-download" download>Download</a>
        <button class="btn ghost light" id="viewer-close">Close</button>
        <button class="btn ghost light" id="viewer-next">›</button>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <input id="file-input" type="file" accept="image/*" multiple hidden />

    <script src="/app.js"></script>
  </body>
</html>
